# Включаем поддержку современных библиотек Jetpack Compose и Room
android.useAndroidX=true

# Автоматически переводим старые зависимости на рельсы AndroidX
android.enableJetifier=true

# Отключаем предупреждение о сборке под Android 14
android.suppressUnsupportedCompileSdk=34

org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
